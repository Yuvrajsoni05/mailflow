{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up · MailFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="mf-auth-wrapper">
    <div class="col-lg-6 mf-auth-form-col">
        <div class="mf-auth-card" style="max-width: 420px;">
            <a href="#" class="mf-logo d-inline-flex align-items-center mb-4">
                <i class="bi bi-envelope-paper-fill me-2" style="color: var(--mf-primary);"></i>
                Mail<span class="dot">Flow</span>
            </a>

            <h1 class="h4 mb-1">Create your account</h1>
            <p class="mf-muted mb-4">Start sending campaigns in minutes.</p>

            <form>
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label small">First Name</label>
                        <input type="text" class="form-control" placeholder="Yuvraj">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Last Name</label>
                        <input type="text" class="form-control" placeholder="Soni">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small">Email</label>
                    <input type="email" class="form-control" placeholder="you@company.com">
                </div>
                <div class="mb-3">
                    <label class="form-label small">Company</label>
                    <input type="text" class="form-control" placeholder="ABC Technologies">
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <label class="form-label small">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="signupPassword" placeholder="••••••••">
                            <button class="btn btn-mf-outline" type="button" data-password-toggle="signupPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Confirm Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="signupPasswordConfirm" placeholder="••••••••">
                            <button class="btn btn-mf-outline" type="button" data-password-toggle="signupPasswordConfirm">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-mf-primary w-100 mb-3">Create Account</button>
                <p class="text-center small mf-muted mb-0">
                    Already have an account? <a href="#">Log in</a>
                </p>
            </form>
        </div>
    </div>

    <div class="col-lg-6 mf-auth-side d-none d-lg-flex">
        <i class="bi bi-envelope-check mb-3" style="font-size: 2rem;"></i>
        <h2>Reach every lead, at the right time.</h2>
        <p>Import your list, personalize with merge fields, and watch delivery, opens and clicks roll in.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
