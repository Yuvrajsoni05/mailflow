{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password · MailFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="mf-auth-wrapper">
    <div class="col-12 mf-auth-form-col">
        <div class="mf-auth-card">
            <a href="#" class="mf-logo d-inline-flex align-items-center mb-4">
                <i class="bi bi-envelope-paper-fill me-2" style="color: var(--mf-primary);"></i>
                Mail<span class="dot">Flow</span>
            </a>

            <h1 class="h4 mb-1">Set a new password</h1>
            <p class="mf-muted mb-4">Choose a strong password you haven't used before.</p>

            <form>
                <div class="mb-3">
                    <label class="form-label small">New Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="resetPassword" placeholder="••••••••">
                        <button class="btn btn-mf-outline" type="button" data-password-toggle="resetPassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="resetPasswordConfirm" placeholder="••••••••">
                        <button class="btn btn-mf-outline" type="button" data-password-toggle="resetPasswordConfirm">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-mf-primary w-100">Reset Password</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
